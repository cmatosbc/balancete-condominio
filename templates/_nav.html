{# Navegação compartilhada — vars: heading, eyebrow (opc), active #}
<header class="mb-7 flex flex-wrap items-center justify-between gap-4">
 <div class="flex items-center gap-3.5">
  <div class="ep-mark" aria-hidden="true">EP</div>
  <div>
   <div class="ep-eyebrow">{{ eyebrow or "Condomínio Elit's Park" }}</div>
   <h1 class="ep-title text-[25px]">{{ heading }}</h1>
  </div>
 </div>
 <div class="flex items-center gap-2">
  <button type="button" class="ep-btn-ghost ep-btn-xs sm:hidden" aria-label="Menu"
   data-hs-collapse="#epnav" aria-controls="epnav" aria-expanded="false">
   <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <nav id="epnav" class="ep-topnav hs-collapse hidden w-full overflow-hidden transition-all sm:flex"
   aria-label="Principal">
   <a class="{{ 'ep-navlink-on' if active == 'painel' else 'ep-navlink' }}" href="/">Painel</a>
   <a class="{{ 'ep-navlink-on' if active == 'hist' else 'ep-navlink' }}" href="/historico.html">Histórico</a>
   <a class="{{ 'ep-navlink-on' if active == 'oc' else 'ep-navlink' }}" href="/ocorrencia">Ocorrência</a>
   <a class="{{ 'ep-navlink-on' if active == 'vot' else 'ep-navlink' }}" href="/propostas">Votações</a>
   <a class="{{ 'ep-navlink-on' if active == 'perfil' else 'ep-navlink' }}" href="/perfil">Perfil</a>
   {% if session.get('role') == 'admin' %}
   <a class="{{ 'ep-navlink-on' if active == 'admin' else 'ep-navlink' }}" href="/admin">Admin</a>
   {% endif %}
   <a class="ep-navlink-exit" href="/logout">Sair</a>
  </nav>
 </div>
</header>
