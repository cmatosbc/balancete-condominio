services:
  site:
    build: .
    ports:
      - "8080:8000"
    environment:
      # troque via .env ou -e; admin sobe PDFs, morador só visualiza
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      MORADOR_PASSWORD: ${MORADOR_PASSWORD:-condominio}
      SECRET_KEY: ${SECRET_KEY:-}
      # Envio de códigos por e-mail (opcional — sem SMTP, use "Gerar código" manual)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Envio de códigos por WhatsApp via Evolution API self-hosted (opcional)
      EVO_URL: ${EVO_URL:-}
      EVO_KEY: ${EVO_KEY:-}
      EVO_INSTANCE: ${EVO_INSTANCE:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
