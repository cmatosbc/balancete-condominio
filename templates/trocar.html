{% extends "base.html" %}
{% block title %}Defina sua senha · Elit's Park{% endblock %}
{% block body %}
<div class="flex min-h-screen items-center justify-center p-5">
 <div class="ep-card w-full max-w-[400px]">
  <div class="ep-eyebrow mb-1.5">Primeiro acesso</div>
  <h1 class="ep-title mb-1 text-[22px]">Defina sua senha</h1>
  <p class="ep-mut mb-5">Unidade <b class="text-slate-200">{{ unidade }}</b> — o código
   de e-mail é temporário. Crie sua senha pessoal (mín. 6 caracteres).</p>

  {% if erro %}<p class="ep-note-bad mb-4">⚠ {{ erro }}</p>{% endif %}

  <form method="post">
   <label class="ep-label">Nova senha</label>
   <input type="password" name="senha" class="ep-input mb-3" minlength="6" required
    autocomplete="new-password">
   <label class="ep-label">Repita a senha</label>
   <input type="password" name="senha2" class="ep-input mb-4" minlength="6" required
    autocomplete="new-password">
   <button type="submit" class="ep-btn-sky w-full">Salvar e entrar</button>
  </form>
 </div>
</div>
{% endblock %}
